name: Habliko Mastodon Video Publisher

on:
  # SOLO manual: lo lanzas tu cuando quieras un video puntual.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: habliko-mastodon-video
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: python3 publish.py
      - name: Commit progress
        if: success()
        run: |
          git config user.name "habliko-bot"
          git config user.email "bot@habliko.com"
          if [ -n "$(git status --porcelain progress_video.json)" ]; then
            git add progress_video.json
            git commit -m "chore: progreso video [skip ci]"
            git push
          fi
